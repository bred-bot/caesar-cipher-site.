<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Шифр Цезаря (Русский)</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }

        textarea,
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #16213e;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 16px;
            background: #0f3460;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-right: 8px;
            transition: background 0.2s;
        }

        button:hover {
            background: #e94560;
        }

        #result {
            margin-top: 15px;
            padding: 14px;
            background: #16213e;
            border-radius: 8px;
            color: #e94560;
            font-size: 16px;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <h1>Шифр Цезаря (RU)</h1>
    <textarea id="input" rows="4" placeholder="Введите текст на русском..."></textarea>
    <input id="shift" type="number" placeholder="Сдвиг (число)" value="3">
    <br>
    <button id="encrypt">Зашифровать</button>
    <button id="decrypt">Расшифровать</button>
    <div id="result"></div>

    <script>
        const upper = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
        const lower = 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя';

        const normalizeShift = (s, len) => ((s % len) + len) % len;

        function caesarRu(text, shift) {
            const sUpper = normalizeShift(shift, upper.length);
            const sLower = normalizeShift(shift, lower.length);
            let result = '';
            for (const ch of text) {
                if (upper.includes(ch)) {
                    const idx = upper.indexOf(ch);
                    result += upper[(idx + sUpper) % upper.length];
                } else if (lower.includes(ch)) {
                    const idx = lower.indexOf(ch);
                    result += lower[(idx + sLower) % lower.length];
                } else {
                    result += ch;
                }
            }
            return result;
        }

        document.getElementById('encrypt').onclick = () => {
            const text = document.getElementById('input').value;
            const shift = parseInt(document.getElementById('shift').value) || 0;
            document.getElementById('result').textContent = caesarRu(text, shift);
        };

        document.getElementById('decrypt').onclick = () => {
            const text = document.getElementById('input').value;
            const shift = parseInt(document.getElementById('shift').value) || 0;
            document.getElementById('result').textContent = caesarRu(text, -shift);
        };
    </script>
</body>

</html>
